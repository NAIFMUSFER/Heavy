name: JANA Verification and Live Smoke
on:
  push:
    branches: [jana-live, jana-integrity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jana-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm run check
      - run: npm test
  live-smoke:
    if: github.ref == 'refs/heads/jana-live'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify deployment commit, dependencies, auth, catalog and assets
        env:
          JANA_EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run smoke
