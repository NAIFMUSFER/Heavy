name: JANA iOS Native Compile
on:
  push:
    branches: [jana-live, jana-integrity]
    paths:
      - 'mobile/**'
      - '!mobile/**/*.md'
      - '.github/workflows/jana-ios-native.yml'
  workflow_dispatch:
concurrency:
  group: jana-ios-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate iOS native project
        run: npx --no-install expo prebuild --platform ios --non-interactive --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Compile iOS simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/jana.xcworkspace -scheme jana -configuration Debug -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | xcpretty
      - name: Verify simulator app
        run: test -d ios/build/Build/Products/Debug-iphonesimulator/jana.app
      - name: Package simulator app for handover
        run: ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Debug-iphonesimulator/jana.app jana-ios-simulator.zip
      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: jana-ios-simulator
          path: mobile/jana-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
