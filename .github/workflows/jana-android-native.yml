name: JANA Android Native Build

on:
  push:
    branches: [jana-live, jana-integrity]
    paths:
      - 'mobile/**'
      - '!mobile/**/*.md'
      - '.github/workflows/jana-android-native.yml'
  workflow_dispatch:

concurrency:
  group: jana-android-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Android native project
        env:
          CI: '1'
          EXPO_PUBLIC_API_BASE: 'https://jana-fresh-app.onrender.com'
        run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Assemble Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jana-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
