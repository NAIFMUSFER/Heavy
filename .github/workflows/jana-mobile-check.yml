name: JANA Mobile Check

on:
  push:
    branches: [jana-live, jana-integrity]
    paths:
      - 'mobile/**'
      - '!mobile/**/*.md'
      - '.github/workflows/jana-mobile-check.yml'
  workflow_dispatch:

concurrency:
  group: jana-mobile-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  expo-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Export Expo web bundle
        working-directory: mobile
        env:
          CI: '1'
        run: npm run check
      - name: Verify export
        run: test -f mobile/dist-test/index.html
