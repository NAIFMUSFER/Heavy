name: JANA Database Integrity
on:
  push:
    branches: [jana-live, jana-integrity]
    paths: ['supabase/**', 'tests/database*', 'tests/coupons.py', 'tests/addresses.py', 'tests/database-history/**', 'scripts/bootstrap-test-database.py', 'scripts/start-test-database.sh', 'tests/postgres.Dockerfile', 'tests/scheduler.py', 'tests/operational-health.py', 'tests/costs.py', 'tests/products.py', 'tests/support.py', 'tests/finance.py', 'tests/substitutions.py', 'tests/inventory-counts.py', 'tests/staff.py', 'tests/customer-saved.py', 'tests/delivery-admin.py', 'tests/warehouses.py', 'tests/warehouse-bins.py', 'tests/supplier-pickup.py', 'tests/procurement-admission.py', 'tests/catalog.py', 'tests/cart.py', 'tests/accounts.py', 'tests/customers.py', 'tests/order-journey.py', 'tests/checkout-recovery.py', 'tests/operations-orders.py', 'tests/weights.py', 'tests/basket-components.py', 'tests/storefront.py', 'tests/storefront_fixture.py', 'tests/disposals.py', 'tests/supplier-credits.py', 'tests/customer-returns.py', 'tests/movements.py', 'tests/notification-outbox.py', 'tests/rpc-contracts.mjs', 'tests/concurrency.py', '.github/workflows/jana-database.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JANA_TEST_DATABASE: disposable
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: jana_test
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL with PostGIS and pg_cron
        run: bash scripts/start-test-database.sh
      - name: Replay recovered migrations in disposable PostgreSQL
        run: python3 scripts/bootstrap-test-database.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Compare Edge RPC arguments with restored PostgreSQL
        run: node tests/rpc-contracts.mjs
      - name: Recheck transactional regressions
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/database-critical-writes.sql -c "DO \$gate\$ BEGIN IF EXISTS (SELECT 1 FROM jsonb_array_elements(current_setting('jana.audit_results')::jsonb) t WHERE t->>'pass' IS DISTINCT FROM 'true') THEN RAISE EXCEPTION 'Transactional regression failed'; END IF; END \$gate\$;"
      - name: Verify paginated staff orders and delivery cash task visibility
        run: python3 tests/operations-orders.py
      - name: Verify read-only checkout recovery and reservation lifecycle
        run: python3 tests/checkout-recovery.py
      - name: Verify order paging tracking and password session integrity
        run: python3 tests/order-journey.py
      - name: Verify commercial policies admission and frozen seller versions
        run: python3 tests/storefront.py
      - name: Concurrent last-stock and last-slot requests
        run: python3 tests/concurrency.py
      - name: Coupon pricing, lifecycle and concurrent usage limit
        run: python3 tests/coupons.py
      - name: Structured addresses ownership and concurrent defaults
        run: python3 tests/addresses.py
      - name: Verify inventory cost and profitability integrity
        run: python3 tests/costs.py
      - name: Verify product families versions and offerings
        run: python3 tests/products.py
      - name: Verify customer and staff support lifecycle
        run: python3 tests/support.py
      - name: Verify refund cash source and partial settlements
        run: python3 tests/finance.py
      - name: Verify customer-approved substitutions and stock concurrency
        run: python3 tests/substitutions.py
      - name: Verify inventory counts metadata and movement integrity
        run: python3 tests/inventory-counts.py
      - name: Verify staff roles cash safeguards and assignment concurrency
        run: python3 tests/staff.py
      - name: Verify saved lists profile and recurring reminder integrity
        run: python3 tests/customer-saved.py
      - name: Verify delivery settings and capacity-edit concurrency
        run: python3 tests/delivery-admin.py
      - name: Verify legacy warehouse ownership outside supplier-pickup launch admission
        run: python3 tests/warehouses.py
      - name: Verify reference warehouse bins and stock placement
        run: python3 tests/warehouse-bins.py
      - name: Verify supplier pickup directory without inventory or cash changes
        run: python3 tests/supplier-pickup.py
      - name: Verify warehouse-free order procurement and exposed staff write boundaries
        run: python3 tests/procurement-admission.py
      - name: Verify catalog pagination and usable availability
        run: python3 tests/catalog.py
      - name: Verify saved cart isolation and concurrent writes
        run: python3 tests/cart.py
      - name: Verify phone identifiers and optional-email accounts
        run: python3 tests/accounts.py
      - name: Verify customer administration privacy and pagination
        run: python3 tests/customers.py
      - name: Verify versioned weights price caps and concurrent extra stock
        run: python3 tests/weights.py
      - name: Verify basket measurements quantities and concurrent finishing
        run: python3 tests/basket-components.py
      - name: Verify inventory disposal costing idempotency and concurrent reservation
        run: python3 tests/disposals.py
      - name: Verify immutable supplier credit reconciliation and role isolation
        run: python3 tests/supplier-credits.py
      - name: Verify paginated stock movement history and role isolation
        run: python3 tests/movements.py
      - name: Verify durable notification leases retry limits and delivery uncertainty
        run: python3 tests/notification-outbox.py
      - name: Verify quarantined customer returns inspection costing and concurrency
        run: python3 tests/customer-returns.py
      - name: Verify read-only operational alerts and recovery observations
        run: python3 tests/operational-health.py
      - name: Verify scheduled expiration runs
        run: python3 tests/scheduler.py
      - name: Remove disposable database
        if: always()
        run: docker rm -f jana-test-postgres
