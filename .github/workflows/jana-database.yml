name: JANA Database Integrity
on:
  push:
    branches: [jana-live, jana-integrity]
    paths: ['supabase/**', 'tests/database*', 'tests/coupons.py', 'tests/addresses.py', 'tests/database-history/**', 'scripts/bootstrap-test-database.py', 'scripts/start-test-database.sh', 'tests/postgres.Dockerfile', 'tests/scheduler.py', 'tests/rpc-contracts.mjs', 'tests/concurrency.py', '.github/workflows/jana-database.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JANA_TEST_DATABASE: disposable
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: jana_test
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL with PostGIS and pg_cron
        run: bash scripts/start-test-database.sh
      - name: Replay recovered migrations in disposable PostgreSQL
        run: python3 scripts/bootstrap-test-database.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Compare Edge RPC arguments with restored PostgreSQL
        run: node tests/rpc-contracts.mjs
      - name: Recheck transactional regressions
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/database-critical-writes.sql -c "DO \$gate\$ BEGIN IF EXISTS (SELECT 1 FROM jsonb_array_elements(current_setting('jana.audit_results')::jsonb) t WHERE t->>'pass' IS DISTINCT FROM 'true') THEN RAISE EXCEPTION 'Transactional regression failed'; END IF; END \$gate\$;"
      - name: Concurrent last-stock and last-slot requests
        run: python3 tests/concurrency.py
      - name: Coupon pricing, lifecycle and concurrent usage limit
        run: python3 tests/coupons.py
      - name: Structured addresses ownership and concurrent defaults
        run: python3 tests/addresses.py
      - name: Verify scheduled expiration runs
        run: python3 tests/scheduler.py
      - name: Remove disposable database
        if: always()
        run: docker rm -f jana-test-postgres
